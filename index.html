<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="0;url=deepseek_html_20250909_2bf8a5.html">
  <title>Redirecionando</title>
</head>
<body>
    <!-- Tela de Login -->
    <div id="login-screen">
        <div class="login-box">
            <h1>APONTTPAY</h1>
            <p>Sistema Completo</p>
            
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label">Usuário</label>
                    <input type="text" class="form-control" id="username" value="admin" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" value="admin123" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">Entrar</button>
            </form>
        </div>
    </div>

    <!-- Painel Admin -->
    <div id="admin-panel" class="admin-panel">
        <div class="portal-header">
            <h1>Painel Administrativo</h1>
            <button class="btn btn-logout" onclick="logout()">Sair</button>
        </div>
        
        <div class="container">
            <div class="admin-tabs">
                <button class="tab-btn active" onclick="switchTab('partners')">Parceiros</button>
                <button class="tab-btn" onclick="switchTab('clients')">Clientes</button>
            </div>
            
            <!-- Aba Parceiros -->
            <div id="partners-tab" class="tab-content active">
                <h2>Gestão de Parceiros</h2>
                <div class="partners-grid" id="partners-grid">
                    <!-- Parceiros serão carregados aqui -->
                </div>
            </div>
            
            <!-- Aba Clientes -->
            <div id="clients-tab" class="tab-content">
                <h2>Gestão de Clientes</h2>
                <button class="btn add-client-btn" onclick="addClient()">+ Adicionar Cliente</button>
                <div class="clients-grid" id="clients-grid">
                    <!-- Clientes serão carregados aqui -->
                </div>
            </div>
        </div>
    </div>

    <!-- Portal do Parceiro -->
    <div id="partner-portal" class="portal">
        <div class="portal-header">
            <h1>Portal do Parceiro</h1>
            <button class="btn btn-logout" onclick="logout()">Sair</button>
        </div>
        
        <div class="portal-content">
            <div class="profile-section">
                <h2>Perfil do Parceiro</h2>
                
                <div class="profile-photo" id="partner-photo">
                    <span id="partner-initial">P</span>
                    <button class="photo-upload" onclick="uploadPartnerPhoto()">
                        <i class="fas fa-camera"></i>
                    </button>
                </div>
                
                <form id="partner-profile-form">
                    <div class="form-group">
                        <label class="form-label">Nome da Empresa</label>
                        <input type="text" class="form-control" id="partner-company" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="partner-email" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Telefone</label>
                        <input type="tel" class="form-control" id="partner-phone" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Responsável</label>
                        <input type="text" class="form-control" id="partner-responsible" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Nova Senha (deixe em branco para manter atual)</label>
                        <input type="password" class="form-control" id="partner-new-password" placeholder="Digite nova senha">
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Portal do Revendedor -->
    <div id="reseller-portal" class="portal">
        <div class="portal-header">
            <h1>Portal do Revendedor</h1>
            <button class="btn btn-logout" onclick="logout()">Sair</button>
        </div>
        
        <div class="portal-content">
            <div class="profile-section">
                <h2>Perfil do Revendedor</h2>
                
                <div class="profile-photo" id="reseller-photo">
                    <span id="reseller-initial">R</span>
                    <button class="photo-upload" onclick="uploadResellerPhoto()">
                        <i class="fas fa-camera"></i>
                    </button>
                </div>
                
                <form id="reseller-profile-form">
                    <div class="form-group">
                        <label class="form-label">Nome</label>
                        <input type="text" class="form-control" id="reseller-name" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="reseller-email" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Telefone</label>
                        <input type="tel" class="form-control" id="reseller-phone" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Nova Senha (deixe em branco para manter atual)</label>
                        <input type="password" class="form-control" id="reseller-new-password" placeholder="Digite nova senha">
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal de Acesso ao Portal -->
    <div id="access-modal" class="modal">
        <div class="modal-content">
            <h3>Acessar Portal do Parceiro</h3>
            <p id="partner-info"></p>
            
            <div class="form-group">
                <label class="form-label">Usuário</label>
                <input type="text" class="form-control" id="modal-username" readonly>
            </div>
            
            <div class="form-group">
                <label class="form-label">Senha</label>
                <input type="password" class="form-control" id="modal-password" readonly>
            </div>
            
            <button class="btn btn-access" onclick="accessPartnerPortal()">Acessar Portal</button>
            <button class="btn" onclick="closeModal()">Fechar</button>
        </div>
    </div>

    <!-- Modal de Cliente -->
    <div id="client-modal" class="modal">
        <div class="modal-content">
            <h3 id="client-modal-title">Adicionar Cliente</h3>
            
            <form id="client-form">
                <div class="form-group">
                    <label class="form-label">Nome *</label>
                    <input type="text" class="form-control" id="client-name" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="client-email">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Telefone</label>
                    <input type="tel" class="form-control" id="client-phone" placeholder="(11) 99999-9999">
                </div>
                
                <div class="form-group">
                    <label class="form-label">CPF</label>
                    <input type="text" class="form-control" id="client-cpf" placeholder="000.000.000-00" maxlength="14">
                </div>
                
                <div class="form-group">
                    <label class="form-label">CNPJ</label>
                    <input type="text" class="form-control" id="client-cnpj" placeholder="00.000.000/0000-00" maxlength="18">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Empresa</label>
                    <input type="text" class="form-control" id="client-company">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Status *</label>
                    <select class="form-control" id="client-status" required>
                        <option value="ativo">Ativo</option>
                        <option value="inativo">Inativo</option>
                        <option value="pendente">Pendente</option>
                    </select>
                </div>
                
                <button type="submit" class="btn btn-primary">Salvar</button>
                <button type="button" class="btn" onclick="closeClientModal()">Cancelar</button>
            </form>
        </div>
    </div>

    <!-- Modal de Visualizar Cliente -->
    <div id="view-client-modal" class="modal">
        <div class="modal-content">
            <h3>Detalhes do Cliente</h3>
            <div id="client-details"></div>
            <button class="btn" onclick="closeViewClientModal()">Fechar</button>
        </div>
    </div>

    <!-- Input oculto para upload de foto -->
    <input type="file" id="photo-input" accept="image/*" style="display: none;">

    <!-- Container de notificações -->
    <div id="notifications"></div>

    <script>
        // Sistema de dados
        let systemData = {
            partners: [
                {
                    id: 1,
                    company: 'Tech Solutions Ltda',
                    email: 'contato@techsolutions.com',
                    phone: '(11) 99999-9999',
                    responsible: 'Carlos Silva',
                    username: 'partner1',
                    password: 'partner123',
                    photo: null
                },
                {
                    id: 2,
                    company: 'Inovações Digitais SA',
                    email: 'comercial@inovacoes.com',
                    phone: '(11) 98888-8888',
                    responsible: 'Ana Costa',
                    username: 'partner2',
                    password: 'partner123',
                    photo: null
                }
            ],
            resellers: [
                {
                    id: 1,
                    name: 'João Revendedor',
                    email: 'joao@revendedor.com',
                    phone: '(11) 97777-7777',
                    username: 'reseller1',
                    password: 'reseller123',
                    photo: null
                }
            ],
            clients: [
                {
                    id: 1,
                    name: 'Maria Silva',
                    email: 'maria@empresa.com',
                    phone: '(11) 96666-6666',
                    cpf: '123.456.789-00',
                    cnpj: '',
                    company: 'Empresa ABC Ltda',
                    status: 'ativo',
                    createdAt: '2024-01-15'
                },
                {
                    id: 2,
                    name: 'Pedro Santos',
                    email: 'pedro@comercio.com',
                    phone: '(11) 95555-5555',
                    cpf: '',
                    cnpj: '12.345.678/0001-90',
                    company: 'Comércio XYZ',
                    status: 'pendente',
                    createdAt: '2024-01-20'
                }
            ]
        };

        let currentUser = null;
        let currentUserType = null;
        let sessionTimeout = null;
        const TIMEOUT_MINUTES = 10;
        const TIMEOUT_MS = TIMEOUT_MINUTES * 60 * 1000;

        // Carregar dados do localStorage
        function loadData() {
            const saved = localStorage.getItem('aponttpay_data');
            if (saved) {
                systemData = JSON.parse(saved);
            }
        }

        // Salvar dados no localStorage
        function saveData(showNotif = true) {
            localStorage.setItem('aponttpay_data', JSON.stringify(systemData));
            if (showNotif) {
                showNotification('success', 'Dados salvos com sucesso!');
            }
        }

        // Salvar sessão
        function saveSession() {
            const sessionData = {
                user: currentUser,
                userType: currentUserType,
                timestamp: Date.now()
            };
            localStorage.setItem('aponttpay_session', JSON.stringify(sessionData));
        }

        // Carregar sessão
        function loadSession() {
            const saved = localStorage.getItem('aponttpay_session');
            if (saved) {
                const sessionData = JSON.parse(saved);
                const now = Date.now();
                const timeDiff = now - sessionData.timestamp;
                
                if (timeDiff < TIMEOUT_MS) {
                    currentUser = sessionData.user;
                    currentUserType = sessionData.userType;
                    
                    // Restaurar sessão baseada no tipo de usuário
                    if (currentUserType === 'admin') {
                        showAdminPanel();
                    } else if (currentUserType === 'partner') {
                        showPartnerPortal(currentUser);
                    } else if (currentUserType === 'reseller') {
                        showResellerPortal(currentUser);
                    }
                    
                    startSessionTimeout();
                    return true;
                }
            }
            return false;
        }

        // Limpar sessão
        function clearSession() {
            localStorage.removeItem('aponttpay_session');
            if (sessionTimeout) {
                clearTimeout(sessionTimeout);
                sessionTimeout = null;
            }
        }

        // Iniciar timeout da sessão
        function startSessionTimeout() {
            if (sessionTimeout) {
                clearTimeout(sessionTimeout);
            }
            
            sessionTimeout = setTimeout(() => {
                showNotification('warning', 'Sessão expirada por inatividade!');
                logout();
            }, TIMEOUT_MS);
        }

        // Resetar timeout (chamado em atividade do usuário)
        function resetSessionTimeout() {
            if (currentUser) {
                saveSession(); // Atualiza timestamp
                startSessionTimeout();
            }
        }

        // Sistema de login
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Login admin
            if (username === 'admin' && password === 'admin123') {
                currentUser = { username: 'admin' };
                currentUserType = 'admin';
                saveSession();
                startSessionTimeout();
                showAdminPanel();
                return;
            }
            
            // Login parceiro
            const partner = systemData.partners.find(p => p.username === username && p.password === password);
            if (partner) {
                currentUser = partner;
                currentUserType = 'partner';
                saveSession();
                startSessionTimeout();
                showPartnerPortal(partner);
                return;
            }
            
            // Login revendedor
            const reseller = systemData.resellers.find(r => r.username === username && r.password === password);
            if (reseller) {
                currentUser = reseller;
                currentUserType = 'reseller';
                saveSession();
                startSessionTimeout();
                showResellerPortal(reseller);
                return;
            }
            
            showNotification('error', 'Usuário ou senha incorretos!');
        });

        // Mostrar painel admin
        function showAdminPanel() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('admin-panel').classList.add('active');
            loadPartners();
            loadClients();
        }

        // Alternar abas
        function switchTab(tabName) {
            // Remover classe active de todas as abas
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            // Ativar aba selecionada
            event.target.classList.add('active');
            document.getElementById(tabName + '-tab').classList.add('active');
        }

        // Carregar parceiros no admin
        function loadPartners() {
            const grid = document.getElementById('partners-grid');
            grid.innerHTML = '';
            
            systemData.partners.forEach(partner => {
                const card = document.createElement('div');
                card.className = 'partner-card';
                card.innerHTML = `
                    <h3>${partner.company}</h3>
                    <p><strong>Responsável:</strong> ${partner.responsible}</p>
                    <p><strong>Email:</strong> ${partner.email}</p>
                    <p><strong>Telefone:</strong> ${partner.phone}</p>
                    <div class="partner-actions">
                        <button class="btn btn-access" onclick="openAccessModal(${partner.id})">
                            <i class="fas fa-external-link-alt"></i> Acessar Portal
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Carregar clientes no admin
        function loadClients() {
            const grid = document.getElementById('clients-grid');
            grid.innerHTML = '';
            
            systemData.clients.forEach(client => {
                const statusColor = client.status === 'ativo' ? 'success' : client.status === 'inativo' ? 'danger' : 'warning';
                const card = document.createElement('div');
                card.className = 'client-card';
                card.innerHTML = `
                    <h3>${client.name}</h3>
                    <p><strong>Empresa:</strong> ${client.company || 'Não informado'}</p>
                    <p><strong>Email:</strong> ${client.email || 'Não informado'}</p>
                    <p><strong>Telefone:</strong> ${client.phone || 'Não informado'}</p>
                    ${client.cpf ? `<p><strong>CPF:</strong> ${client.cpf}</p>` : ''}
                    ${client.cnpj ? `<p><strong>CNPJ:</strong> ${client.cnpj}</p>` : ''}
                    <p><strong>Status:</strong> <span style="color: var(--${statusColor}); font-weight: bold;">${client.status.toUpperCase()}</span></p>
                    <div class="client-actions">
                        <button class="btn btn-view btn-sm" onclick="viewClient(${client.id})">
                            <i class="fas fa-eye"></i> Ver
                        </button>
                        <button class="btn btn-edit btn-sm" onclick="editClient(${client.id})">
                            <i class="fas fa-edit"></i> Editar
                        </button>
                        <button class="btn btn-status btn-sm" onclick="toggleClientStatus(${client.id})">
                            <i class="fas fa-toggle-on"></i> Status
                        </button>
                        <button class="btn btn-delete btn-sm" onclick="deleteClient(${client.id})">
                            <i class="fas fa-trash"></i> Excluir
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Abrir modal de acesso
        function openAccessModal(partnerId) {
            const partner = systemData.partners.find(p => p.id === partnerId);
            if (partner) {
                document.getElementById('partner-info').textContent = `Acessar portal de: ${partner.company}`;
                document.getElementById('modal-username').value = partner.username;
                document.getElementById('modal-password').value = partner.password;
                document.getElementById('access-modal').classList.add('active');
                
                // Armazenar ID do parceiro para acesso
                document.getElementById('access-modal').dataset.partnerId = partnerId;
            }
        }

        // Acessar portal do parceiro via modal
        function accessPartnerPortal() {
            const partnerId = document.getElementById('access-modal').dataset.partnerId;
            const partner = systemData.partners.find(p => p.id == partnerId);
            
            if (partner) {
                currentUser = partner;
                currentUserType = 'partner';
                saveSession();
                startSessionTimeout();
                closeModal();
                document.getElementById('admin-panel').classList.remove('active');
                showPartnerPortal(partner);
            }
        }

        // Fechar modal
        function closeModal() {
            document.getElementById('access-modal').classList.remove('active');
        }

        // Mostrar portal do parceiro
        function showPartnerPortal(partner) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('partner-portal').classList.add('active');
            
            // Carregar dados do parceiro
            document.getElementById('partner-company').value = partner.company;
            document.getElementById('partner-email').value = partner.email;
            document.getElementById('partner-phone').value = partner.phone;
            document.getElementById('partner-responsible').value = partner.responsible;
            
            // Carregar foto
            const photoDiv = document.getElementById('partner-photo');
            const initial = document.getElementById('partner-initial');
            
            if (partner.photo) {
                photoDiv.innerHTML = `<img src="${partner.photo}" alt="Foto"><button class="photo-upload" onclick="uploadPartnerPhoto()"><i class="fas fa-camera"></i></button>`;
            } else {
                initial.textContent = partner.company.charAt(0).toUpperCase();
            }
        }

        // Mostrar portal do revendedor
        function showResellerPortal(reseller) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('reseller-portal').classList.add('active');
            
            // Carregar dados do revendedor
            document.getElementById('reseller-name').value = reseller.name;
            document.getElementById('reseller-email').value = reseller.email;
            document.getElementById('reseller-phone').value = reseller.phone;
            
            // Carregar foto
            const photoDiv = document.getElementById('reseller-photo');
            const initial = document.getElementById('reseller-initial');
            
            if (reseller.photo) {
                photoDiv.innerHTML = `<img src="${reseller.photo}" alt="Foto"><button class="photo-upload" onclick="uploadResellerPhoto()"><i class="fas fa-camera"></i></button>`;
            } else {
                initial.textContent = reseller.name.charAt(0).toUpperCase();
            }
        }

        // Upload de foto do parceiro
        function uploadPartnerPhoto() {
            const input = document.getElementById('photo-input');
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const photoData = e.target.result;
                        
                        // Atualizar foto no sistema
                        currentUser.photo = photoData;
                        const partnerIndex = systemData.partners.findIndex(p => p.id === currentUser.id);
                        if (partnerIndex !== -1) {
                            systemData.partners[partnerIndex].photo = photoData;
                        }
                        
                        // Atualizar interface
                        const photoDiv = document.getElementById('partner-photo');
                        photoDiv.innerHTML = `<img src="${photoData}" alt="Foto"><button class="photo-upload" onclick="uploadPartnerPhoto()"><i class="fas fa-camera"></i></button>`;
                        
                        // Salvar automaticamente
                        saveData();
                        saveSession();
                    };
                    reader.readAsDataURL(file);
                }
            };
            input.click();
        }

        // Upload de foto do revendedor
        function uploadResellerPhoto() {
            const input = document.getElementById('photo-input');
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const photoData = e.target.result;
                        
                        // Atualizar foto no sistema
                        currentUser.photo = photoData;
                        const resellerIndex = systemData.resellers.findIndex(r => r.id === currentUser.id);
                        if (resellerIndex !== -1) {
                            systemData.resellers[resellerIndex].photo = photoData;
                        }
                        
                        // Atualizar interface
                        const photoDiv = document.getElementById('reseller-photo');
                        photoDiv.innerHTML = `<img src="${photoData}" alt="Foto"><button class="photo-upload" onclick="uploadResellerPhoto()"><i class="fas fa-camera"></i></button>`;
                        
                        // Salvar automaticamente
                        saveData();
                        saveSession();
                    };
                    reader.readAsDataURL(file);
                }
            };
            input.click();
        }

        // Salvar perfil do parceiro
        document.getElementById('partner-profile-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const company = document.getElementById('partner-company').value;
            const email = document.getElementById('partner-email').value;
            const phone = document.getElementById('partner-phone').value;
            const responsible = document.getElementById('partner-responsible').value;
            const newPassword = document.getElementById('partner-new-password').value;
            
            // Atualizar dados
            currentUser.company = company;
            currentUser.email = email;
            currentUser.phone = phone;
            currentUser.responsible = responsible;
            
            // Atualizar senha se fornecida
            if (newPassword.trim()) {
                currentUser.password = newPassword.trim();
                showNotification('success', 'Senha alterada com sucesso!');
            }
            
            const partnerIndex = systemData.partners.findIndex(p => p.id === currentUser.id);
            if (partnerIndex !== -1) {
                systemData.partners[partnerIndex] = { ...systemData.partners[partnerIndex], ...currentUser };
            }
            
            // Salvar automaticamente
            saveData();
            saveSession();
        });

        // Salvar perfil do revendedor
        document.getElementById('reseller-profile-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('reseller-name').value;
            const email = document.getElementById('reseller-email').value;
            const phone = document.getElementById('reseller-phone').value;
            const newPassword = document.getElementById('reseller-new-password').value;
            
            // Atualizar dados
            currentUser.name = name;
            currentUser.email = email;
            currentUser.phone = phone;
            
            // Atualizar senha se fornecida
            if (newPassword.trim()) {
                currentUser.password = newPassword.trim();
                showNotification('success', 'Senha alterada com sucesso!');
            }
            
            const resellerIndex = systemData.resellers.findIndex(r => r.id === currentUser.id);
            if (resellerIndex !== -1) {
                systemData.resellers[resellerIndex] = { ...systemData.resellers[resellerIndex], ...currentUser };
            }
            
            // Salvar automaticamente
            saveData();
            saveSession();
        });

        // Logout
        function logout() {
            currentUser = null;
            currentUserType = null;
            clearSession();
            
            // Ocultar todos os portais
            document.getElementById('admin-panel').classList.remove('active');
            document.getElementById('partner-portal').classList.remove('active');
            document.getElementById('reseller-portal').classList.remove('active');
            
            // Mostrar tela de login
            document.getElementById('login-screen').style.display = 'block';
            
            // Limpar campos
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        // Sistema de notificações
        function showNotification(type, message) {
            const container = document.getElementById('notifications');
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            
            container.appendChild(notification);
            
            setTimeout(() => {
                notification.classList.add('show');
            }, 100);
            
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => {
                    notification.remove();
                }, 300);
            }, 3000);
        }

        // Funções de gerenciamento de clientes
        let editingClientId = null;

        // Adicionar cliente
        function addClient() {
            editingClientId = null;
            document.getElementById('client-modal-title').textContent = 'Adicionar Cliente';
            document.getElementById('client-form').reset();
            document.getElementById('client-status').value = 'ativo';
            document.getElementById('client-modal').classList.add('active');
        }

        // Editar cliente
        function editClient(clientId) {
            const client = systemData.clients.find(c => c.id === clientId);
            if (client) {
                editingClientId = clientId;
                document.getElementById('client-modal-title').textContent = 'Editar Cliente';
                document.getElementById('client-name').value = client.name;
                document.getElementById('client-email').value = client.email || '';
                document.getElementById('client-phone').value = client.phone || '';
                document.getElementById('client-cpf').value = client.cpf || '';
                document.getElementById('client-cnpj').value = client.cnpj || '';
                document.getElementById('client-company').value = client.company || '';
                document.getElementById('client-status').value = client.status;
                document.getElementById('client-modal').classList.add('active');
            }
        }

        // Visualizar cliente
        function viewClient(clientId) {
            const client = systemData.clients.find(c => c.id === clientId);
            if (client) {
                const details = document.getElementById('client-details');
                details.innerHTML = `
                    <p><strong>Nome:</strong> ${client.name}</p>
                    <p><strong>Email:</strong> ${client.email || 'Não informado'}</p>
                    <p><strong>Telefone:</strong> ${client.phone || 'Não informado'}</p>
                    ${client.cpf ? `<p><strong>CPF:</strong> ${client.cpf}</p>` : ''}
                    ${client.cnpj ? `<p><strong>CNPJ:</strong> ${client.cnpj}</p>` : ''}
                    <p><strong>Empresa:</strong> ${client.company || 'Não informado'}</p>
                    <p><strong>Status:</strong> ${client.status.toUpperCase()}</p>
                    <p><strong>Data de Cadastro:</strong> ${client.createdAt}</p>
                `;
                document.getElementById('view-client-modal').classList.add('active');
            }
        }

        // Alternar status do cliente
        function toggleClientStatus(clientId) {
            const client = systemData.clients.find(c => c.id === clientId);
            if (client) {
                const newStatus = client.status === 'ativo' ? 'inativo' : 'ativo';
                client.status = newStatus;
                saveData(false);
                loadClients();
                showNotification('success', `Status do cliente alterado para ${newStatus.toUpperCase()}!`);
            }
        }

        // Excluir cliente
        function deleteClient(clientId) {
            if (confirm('Tem certeza que deseja excluir este cliente?')) {
                const index = systemData.clients.findIndex(c => c.id === clientId);
                if (index !== -1) {
                    systemData.clients.splice(index, 1);
                    saveData(false);
                    loadClients();
                    showNotification('success', 'Cliente excluído com sucesso!');
                }
            }
        }

        // Fechar modal de cliente
        function closeClientModal() {
            document.getElementById('client-modal').classList.remove('active');
            editingClientId = null;
        }

        // Fechar modal de visualizar cliente
        function closeViewClientModal() {
            document.getElementById('view-client-modal').classList.remove('active');
        }

        // Salvar cliente (adicionar ou editar)
        document.getElementById('client-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('client-name').value.trim();
            const email = document.getElementById('client-email').value.trim();
            const phone = document.getElementById('client-phone').value.trim();
            const cpf = document.getElementById('client-cpf').value.trim();
            const cnpj = document.getElementById('client-cnpj').value.trim();
            const company = document.getElementById('client-company').value.trim();
            const status = document.getElementById('client-status').value;
            
            if (!name) {
                showNotification('error', 'Nome é obrigatório!');
                return;
            }
            
            if (editingClientId) {
                // Editar cliente existente
                const client = systemData.clients.find(c => c.id === editingClientId);
                if (client) {
                    client.name = name;
                    client.email = email;
                    client.phone = phone;
                    client.cpf = cpf;
                    client.cnpj = cnpj;
                    client.company = company;
                    client.status = status;
                    showNotification('success', 'Cliente atualizado com sucesso!');
                }
            } else {
                // Adicionar novo cliente
                const newId = Math.max(...systemData.clients.map(c => c.id), 0) + 1;
                const newClient = {
                    id: newId,
                    name: name,
                    email: email,
                    phone: phone,
                    cpf: cpf,
                    cnpj: cnpj,
                    company: company,
                    status: status,
                    createdAt: new Date().toISOString().split('T')[0]
                };
                systemData.clients.push(newClient);
                showNotification('success', 'Cliente adicionado com sucesso!');
            }
            
            saveData(false);
            loadClients();
            closeClientModal();
        });

        // Configuração de formatação de campos
        function setupFieldFormatting() {
            // Formatar CPF
            const cpfField = document.getElementById('client-cpf');
            if (cpfField) {
                cpfField.addEventListener('input', function(e) {
                    let value = e.target.value.replace(/\D/g, '');
                    if (value.length <= 11) {
                        value = value.replace(/(\d{3})(\d)/, '$1.$2');
                        value = value.replace(/(\d{3})(\d)/, '$1.$2');
                        value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
                        e.target.value = value;
                    }
                });
            }
            
            // Formatar CNPJ
            const cnpjField = document.getElementById('client-cnpj');
            if (cnpjField) {
                cnpjField.addEventListener('input', function(e) {
                    let value = e.target.value.replace(/\D/g, '');
                    if (value.length <= 14) {
                        value = value.replace(/(\d{2})(\d)/, '$1.$2');
                        value = value.replace(/(\d{3})(\d)/, '$1.$2');
                        value = value.replace(/(\d{3})(\d)/, '$1/$2');
                        value = value.replace(/(\d{4})(\d{1,2})$/, '$1-$2');
                        e.target.value = value;
                    }
                });
            }
            
            // Formatar Telefone
            const phoneField = document.getElementById('client-phone');
            if (phoneField) {
                phoneField.addEventListener('input', function(e) {
                    let value = e.target.value.replace(/\D/g, '');
                    if (value.length <= 11) {
                        if (value.length <= 10) {
                            value = value.replace(/(\d{2})(\d)/, '($1) $2');
                            value = value.replace(/(\d{4})(\d)/, '$1-$2');
                        } else {
                            value = value.replace(/(\d{2})(\d)/, '($1) $2');
                            value = value.replace(/(\d{5})(\d)/, '$1-$2');
                        }
                        e.target.value = value;
                    }
                });
            }
        }
        
        // Inicialização
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            
            // Tentar carregar sessão existente
            if (!loadSession()) {
                // Se não há sessão válida, mostrar tela de login
                document.getElementById('login-screen').style.display = 'block';
            }
            
            // Adicionar listeners para detectar atividade do usuário
            const events = ['mousedown', 'mousemove', 'keypress', 'scroll', 'touchstart', 'click'];
            events.forEach(event => {
                document.addEventListener(event, resetSessionTimeout, true);
            });
            
            // Formatação automática de campos
            setupFieldFormatting();
        });
    </script>
</body>
</html>
