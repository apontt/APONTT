<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APONTTPAY - Sistema Completo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6a11cb;
            --secondary: #2575fc;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
            --info: #17a2b8;
            --dark: #343a40;
            --light: #f8f9fa;
            --gray: #6c757d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            margin: 100px auto;
            color: white;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 16px;
        }

        .form-control:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.5);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

        .portal {
            display: none;
            background: white;
            min-height: 100vh;
            color: #333;
        }

        .portal.active {
            display: block;
        }

        .portal-header {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            padding: 20px;
            text-align: center;
        }

        .portal-content {
            padding: 30px;
        }

        .profile-section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .profile-photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
            margin: 0 auto 20px;
            position: relative;
            overflow: hidden;
        }

        .profile-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-upload {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            cursor: pointer;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            border-radius: 8px;
            padding: 15px 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            border-left: 4px solid var(--success);
        }

        .notification.error {
            border-left: 4px solid var(--danger);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
        }

        .btn-logout {
            background: var(--danger);
            color: white;
            margin-top: 20px;
        }

        .btn-access {
            background: var(--info);
            color: white;
            margin: 10px;
        }

        .admin-panel {
            display: none;
            background: white;
            min-height: 100vh;
            padding: 20px;
        }

        .admin-panel.active {
            display: block;
        }

        .partners-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .partner-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #ddd;
        }

        .partner-actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>
    <!-- Tela de Login -->
    <div id="login-screen">
        <div class="login-box">
            <h1>APONTTPAY</h1>
            <p>Sistema Completo</p>
            
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label">Usuário</label>
                    <input type="text" class="form-control" id="username" value="admin" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" value="admin123" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">Entrar</button>
            </form>
        </div>
    </div>

    <!-- Painel Admin -->
    <div id="admin-panel" class="admin-panel">
        <div class="portal-header">
            <h1>Painel Administrativo</h1>
            <button class="btn btn-logout" onclick="logout()">Sair</button>
        </div>
        
        <div class="container">
            <h2>Gestão de Parceiros</h2>
            
            <div class="partners-grid" id="partners-grid">
                <!-- Parceiros serão carregados aqui -->
            </div>
        </div>
    </div>

    <!-- Portal do Parceiro -->
    <div id="partner-portal" class="portal">
        <div class="portal-header">
            <h1>Portal do Parceiro</h1>
            <button class="btn btn-logout" onclick="logout()">Sair</button>
        </div>
        
        <div class="portal-content">
            <div class="profile-section">
                <h2>Perfil do Parceiro</h2>
                
                <div class="profile-photo" id="partner-photo">
                    <span id="partner-initial">P</span>
                    <button class="photo-upload" onclick="uploadPartnerPhoto()">
                        <i class="fas fa-camera"></i>
                    </button>
                </div>
                
                <form id="partner-profile-form">
                    <div class="form-group">
                        <label class="form-label">Nome da Empresa</label>
                        <input type="text" class="form-control" id="partner-company" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="partner-email" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Telefone</label>
                        <input type="tel" class="form-control" id="partner-phone" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Responsável</label>
                        <input type="text" class="form-control" id="partner-responsible" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Portal do Revendedor -->
    <div id="reseller-portal" class="portal">
        <div class="portal-header">
            <h1>Portal do Revendedor</h1>
            <button class="btn btn-logout" onclick="logout()">Sair</button>
        </div>
        
        <div class="portal-content">
            <div class="profile-section">
                <h2>Perfil do Revendedor</h2>
                
                <div class="profile-photo" id="reseller-photo">
                    <span id="reseller-initial">R</span>
                    <button class="photo-upload" onclick="uploadResellerPhoto()">
                        <i class="fas fa-camera"></i>
                    </button>
                </div>
                
                <form id="reseller-profile-form">
                    <div class="form-group">
                        <label class="form-label">Nome</label>
                        <input type="text" class="form-control" id="reseller-name" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="reseller-email" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Telefone</label>
                        <input type="tel" class="form-control" id="reseller-phone" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal de Acesso ao Portal -->
    <div id="access-modal" class="modal">
        <div class="modal-content">
            <h3>Acessar Portal do Parceiro</h3>
            <p id="partner-info"></p>
            
            <div class="form-group">
                <label class="form-label">Usuário</label>
                <input type="text" class="form-control" id="modal-username" readonly>
            </div>
            
            <div class="form-group">
                <label class="form-label">Senha</label>
                <input type="password" class="form-control" id="modal-password" readonly>
            </div>
            
            <button class="btn btn-access" onclick="accessPartnerPortal()">Acessar Portal</button>
            <button class="btn" onclick="closeModal()">Fechar</button>
        </div>
    </div>

    <!-- Input oculto para upload de foto -->
    <input type="file" id="photo-input" accept="image/*" style="display: none;">

    <!-- Container de notificações -->
    <div id="notifications"></div>

    <script>
        // Sistema de dados
        let systemData = {
            partners: [
                {
                    id: 1,
                    company: 'Tech Solutions Ltda',
                    email: 'contato@techsolutions.com',
                    phone: '(11) 99999-9999',
                    responsible: 'Carlos Silva',
                    username: 'partner1',
                    password: 'partner123',
                    photo: null
                },
                {
                    id: 2,
                    company: 'Inovações Digitais SA',
                    email: 'comercial@inovacoes.com',
                    phone: '(11) 98888-8888',
                    responsible: 'Ana Costa',
                    username: 'partner2',
                    password: 'partner123',
                    photo: null
                }
            ],
            resellers: [
                {
                    id: 1,
                    name: 'João Revendedor',
                    email: 'joao@revendedor.com',
                    phone: '(11) 97777-7777',
                    username: 'reseller1',
                    password: 'reseller123',
                    photo: null
                }
            ]
        };

        let currentUser = null;
        let currentUserType = null;

        // Carregar dados do localStorage
        function loadData() {
            const saved = localStorage.getItem('aponttpay_data');
            if (saved) {
                systemData = JSON.parse(saved);
            }
        }

        // Salvar dados no localStorage
        function saveData() {
            localStorage.setItem('aponttpay_data', JSON.stringify(systemData));
            showNotification('success', 'Dados salvos com sucesso!');
        }

        // Sistema de login
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Login admin
            if (username === 'admin' && password === 'admin123') {
                currentUser = { username: 'admin' };
                currentUserType = 'admin';
                showAdminPanel();
                return;
            }
            
            // Login parceiro
            const partner = systemData.partners.find(p => p.username === username && p.password === password);
            if (partner) {
                currentUser = partner;
                currentUserType = 'partner';
                showPartnerPortal(partner);
                return;
            }
            
            // Login revendedor
            const reseller = systemData.resellers.find(r => r.username === username && r.password === password);
            if (reseller) {
                currentUser = reseller;
                currentUserType = 'reseller';
                showResellerPortal(reseller);
                return;
            }
            
            showNotification('error', 'Usuário ou senha incorretos!');
        });

        // Mostrar painel admin
        function showAdminPanel() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('admin-panel').classList.add('active');
            loadPartners();
        }

        // Carregar parceiros no admin
        function loadPartners() {
            const grid = document.getElementById('partners-grid');
            grid.innerHTML = '';
            
            systemData.partners.forEach(partner => {
                const card = document.createElement('div');
                card.className = 'partner-card';
                card.innerHTML = `
                    <h3>${partner.company}</h3>
                    <p><strong>Responsável:</strong> ${partner.responsible}</p>
                    <p><strong>Email:</strong> ${partner.email}</p>
                    <p><strong>Telefone:</strong> ${partner.phone}</p>
                    <div class="partner-actions">
                        <button class="btn btn-access" onclick="openAccessModal(${partner.id})">
                            <i class="fas fa-external-link-alt"></i> Acessar Portal
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Abrir modal de acesso
        function openAccessModal(partnerId) {
            const partner = systemData.partners.find(p => p.id === partnerId);
            if (partner) {
                document.getElementById('partner-info').textContent = `Acessar portal de: ${partner.company}`;
                document.getElementById('modal-username').value = partner.username;
                document.getElementById('modal-password').value = partner.password;
                document.getElementById('access-modal').classList.add('active');
                
                // Armazenar ID do parceiro para acesso
                document.getElementById('access-modal').dataset.partnerId = partnerId;
            }
        }

        // Acessar portal do parceiro via modal
        function accessPartnerPortal() {
            const partnerId = document.getElementById('access-modal').dataset.partnerId;
            const partner = systemData.partners.find(p => p.id == partnerId);
            
            if (partner) {
                currentUser = partner;
                currentUserType = 'partner';
                closeModal();
                document.getElementById('admin-panel').classList.remove('active');
                showPartnerPortal(partner);
            }
        }

        // Fechar modal
        function closeModal() {
            document.getElementById('access-modal').classList.remove('active');
        }

        // Mostrar portal do parceiro
        function showPartnerPortal(partner) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('partner-portal').classList.add('active');
            
            // Carregar dados do parceiro
            document.getElementById('partner-company').value = partner.company;
            document.getElementById('partner-email').value = partner.email;
            document.getElementById('partner-phone').value = partner.phone;
            document.getElementById('partner-responsible').value = partner.responsible;
            
            // Carregar foto
            const photoDiv = document.getElementById('partner-photo');
            const initial = document.getElementById('partner-initial');
            
            if (partner.photo) {
                photoDiv.innerHTML = `<img src="${partner.photo}" alt="Foto"><button class="photo-upload" onclick="uploadPartnerPhoto()"><i class="fas fa-camera"></i></button>`;
            } else {
                initial.textContent = partner.company.charAt(0).toUpperCase();
            }
        }

        // Mostrar portal do revendedor
        function showResellerPortal(reseller) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('reseller-portal').classList.add('active');
            
            // Carregar dados do revendedor
            document.getElementById('reseller-name').value = reseller.name;
            document.getElementById('reseller-email').value = reseller.email;
            document.getElementById('reseller-phone').value = reseller.phone;
            
            // Carregar foto
            const photoDiv = document.getElementById('reseller-photo');
            const initial = document.getElementById('reseller-initial');
            
            if (reseller.photo) {
                photoDiv.innerHTML = `<img src="${reseller.photo}" alt="Foto"><button class="photo-upload" onclick="uploadResellerPhoto()"><i class="fas fa-camera"></i></button>`;
            } else {
                initial.textContent = reseller.name.charAt(0).toUpperCase();
            }
        }

        // Upload de foto do parceiro
        function uploadPartnerPhoto() {
            const input = document.getElementById('photo-input');
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const photoData = e.target.result;
                        
                        // Atualizar foto no sistema
                        currentUser.photo = photoData;
                        const partnerIndex = systemData.partners.findIndex(p => p.id === currentUser.id);
                        if (partnerIndex !== -1) {
                            systemData.partners[partnerIndex].photo = photoData;
                        }
                        
                        // Atualizar interface
                        const photoDiv = document.getElementById('partner-photo');
                        photoDiv.innerHTML = `<img src="${photoData}" alt="Foto"><button class="photo-upload" onclick="uploadPartnerPhoto()"><i class="fas fa-camera"></i></button>`;
                        
                        saveData();
                    };
                    reader.readAsDataURL(file);
                }
            };
            input.click();
        }

        // Upload de foto do revendedor
        function uploadResellerPhoto() {
            const input = document.getElementById('photo-input');
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const photoData = e.target.result;
                        
                        // Atualizar foto no sistema
                        currentUser.photo = photoData;
                        const resellerIndex = systemData.resellers.findIndex(r => r.id === currentUser.id);
                        if (resellerIndex !== -1) {
                            systemData.resellers[resellerIndex].photo = photoData;
                        }
                        
                        // Atualizar interface
                        const photoDiv = document.getElementById('reseller-photo');
                        photoDiv.innerHTML = `<img src="${photoData}" alt="Foto"><button class="photo-upload" onclick="uploadResellerPhoto()"><i class="fas fa-camera"></i></button>`;
                        
                        saveData();
                    };
                    reader.readAsDataURL(file);
                }
            };
            input.click();
        }

        // Salvar perfil do parceiro
        document.getElementById('partner-profile-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const company = document.getElementById('partner-company').value;
            const email = document.getElementById('partner-email').value;
            const phone = document.getElementById('partner-phone').value;
            const responsible = document.getElementById('partner-responsible').value;
            
            // Atualizar dados
            currentUser.company = company;
            currentUser.email = email;
            currentUser.phone = phone;
            currentUser.responsible = responsible;
            
            const partnerIndex = systemData.partners.findIndex(p => p.id === currentUser.id);
            if (partnerIndex !== -1) {
                systemData.partners[partnerIndex] = { ...systemData.partners[partnerIndex], ...currentUser };
            }
            
            saveData();
        });

        // Salvar perfil do revendedor
        document.getElementById('reseller-profile-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('reseller-name').value;
            const email = document.getElementById('reseller-email').value;
            const phone = document.getElementById('reseller-phone').value;
            
            // Atualizar dados
            currentUser.name = name;
            currentUser.email = email;
            currentUser.phone = phone;
            
            const resellerIndex = systemData.resellers.findIndex(r => r.id === currentUser.id);
            if (resellerIndex !== -1) {
                systemData.resellers[resellerIndex] = { ...systemData.resellers[resellerIndex], ...currentUser };
            }
            
            saveData();
        });

        // Logout
        function logout() {
            currentUser = null;
            currentUserType = null;
            
            // Ocultar todos os portais
            document.getElementById('admin-panel').classList.remove('active');
            document.getElementById('partner-portal').classList.remove('active');
            document.getElementById('reseller-portal').classList.remove('active');
            
            // Mostrar tela de login
            document.getElementById('login-screen').style.display = 'block';
            
            // Limpar campos
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        // Sistema de notificações
        function showNotification(type, message) {
            const container = document.getElementById('notifications');
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            
            container.appendChild(notification);
            
            setTimeout(() => {
                notification.classList.add('show');
            }, 100);
            
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => {
                    notification.remove();
                }, 300);
            }, 3000);
        }

        // Inicialização
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
        });
    </script>
</body>
</html>
